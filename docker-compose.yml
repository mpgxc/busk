services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comparai
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comparai"]
      interval: 2s
      retries: 20

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/comparai?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-0123456789}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-dev}
    ports: ["8080:8080"]

volumes:
  pgdata:
